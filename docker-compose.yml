services:
  telegram-bot-music:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:-123456789,987654321}
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-mp3}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-1800}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-52428800}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-157286400}
      MUSIC_BOT_WORKDIR: /tmp/music-bot
    volumes:
      - music-bot-work:/tmp/music-bot

volumes:
  music-bot-work:
